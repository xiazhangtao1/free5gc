# Project overlay for deploying free5GC with UL-CL on Kubernetes.
# Adjust the interface names and IP pools to match the target cluster before
# installing this values file in a real gNB environment.

global:
  name: free5gc
  projectName: free5gc
  userPlaneArchitecture: ulcl
  uesubnet: 10.60.0.0/16
  plmn:
    mcc: "460"
    mnc: "11"
    id: "46011"
  snssai:
    sst: 1
    sd: "010101"
  dnn: cmnet
  subscriber:
    imsi: "460110000000100"
    k: "12345600000000000000000000000000"
    opc: "12345600000000000000000000000000"

  nrf:
    service:
      name: nrf-nnrf
      type: ClusterIP
      port: "8000"
      nodePort: "30800"

  sbi:
    scheme: http

  amf:
    hostNetwork:
      enabled: false
      dnsPolicy: ClusterFirstWithHostNet
    multus:
      enabled: true
      n2if:
        ipAddress: 10.100.50.249
      n2network:
        enabled: true
        name: n2network
        type: ipvlan
        masterIf: wlp128s0
        subnetIP: 10.100.50.248
        cidr: 29
        gatewayIP: 10.100.50.254
        excludeIP: 10.100.50.254
    service:
      ngap:
        enabled: true
        name: amf-n2
        bindAddress: 0.0.0.0
        port: 38412
        nodeport: 38412
        protocol: SCTP
        type: ClusterIP
        hostPort:
          enabled: true
          hostIP: ""
          port: 38412

  smf:
    multus:
      enabled: true
      n4if:
        ipAddress: 10.100.50.244
      n4network:
        enabled: true
        name: n4network
        type: ipvlan
        masterIf: wlp128s0
        subnetIP: 10.100.50.240
        cidr: 29
        gatewayIP: 10.100.50.246
        excludeIP: 10.100.50.246

  upf:
    service:
      gtpu:
        enabled: true
        type: ClusterIP
        bindAddress: 0.0.0.0
        port: 2152
        nodePort: 2152
        protocol: UDP
        hostPort:
          enabled: true
          hostIP: ""
          port: 2152
        # Set this to the Kubernetes node IP reachable by external same-L2 gNBs.
        advertiseAddress: 192.168.25.124
    multus:
      enabled: true
      iupf1:
        n3if:
          ipAddress: 10.100.50.234
        n4if:
          ipAddress: 10.100.50.245
        n6if:
          ipAddress: 10.100.100.14
        n9if:
          ipAddress: 10.100.50.227
      psaupf1:
        n4if:
          ipAddress: 10.100.50.242
        n6if:
          ipAddress: 10.100.100.12
        n9if:
          ipAddress: 10.100.50.225
      psaupf2:
        n4if:
          ipAddress: 10.100.50.243
        n6if:
          ipAddress: 10.100.200.12
        n9if:
          ipAddress: 10.100.50.226
      n3network:
        enabled: true
        name: n3network
        type: ipvlan
        masterIf: wlp128s0
        subnetIP: 10.100.50.232
        cidr: 29
        gatewayIP: 10.100.50.238
        excludeIP: 10.100.50.238
      n4network:
        enabled: true
        name: n4network
        type: ipvlan
        masterIf: wlp128s0
        subnetIP: 10.100.50.240
        cidr: 29
        gatewayIP: 10.100.50.246
        excludeIP: 10.100.50.246
      n6network:
        enabled: true
        name: n6network
        type: ipvlan
        masterIf: wlp128s0
        subnetIP: 10.100.100.0
        cidr: 24
        gatewayIP: 10.100.100.1
        excludeIP: 10.100.100.254
        psaupf1:
          enabled: true
          name: n6network-psaupf1
          type: ipvlan
          masterIf: wlp128s0
          subnetIP: 10.100.100.0
          cidr: 24
          gatewayIP: 10.100.100.1
          excludeIP: 10.100.100.254
        psaupf2:
          enabled: true
          name: n6network-psaupf2
          type: ipvlan
          masterIf: wlp128s0
          subnetIP: 10.100.200.0
          cidr: 24
          gatewayIP: 10.100.200.1
          excludeIP: 10.100.200.254
      n9network:
        enabled: true
        name: n9network
        type: ipvlan
        masterIf: wlp128s0
        subnetIP: 10.100.50.224
        cidr: 29
        gatewayIP: 10.100.50.230
        excludeIP: 10.100.50.230

deployMongoDb: true
deployAmf: true
deployAusf: true
deployChf: true
deployN3iwf: false
deployNef: true
deployNrf: true
deployNssf: true
deployPcf: true
deploySmf: true
deployUdm: true
deployUdr: true
deployUpf: true
deployWebui: true
deployDbPython: false

mongodb:
  fullnameOverride: mongodb
  useStatefulSet: true
  extraDeploy: []
  auth:
    enabled: false
  persistence:
    size: 8Gi
    mountPath: /bitnami/mongodb/data/db/
    storageClass: local-path
  service:
    name: mongodb
    type: ClusterIP
    port: 27017
    nodePort: "30017"

free5gc-smf:
  smf:
    configuration:
      ueRoutingInfo: |-
        UE_EDGE_1:
          members:
          - imsi-460110000000100
          topology:
            - A: gNB1
              B: BranchingUPF
            - A: BranchingUPF
              B: AnchorUPF1
          specificPath:
            - dest: 10.100.100.16/32
              path: [BranchingUPF, AnchorUPF2]
        UE_EDGE_2:
          members:
          - imsi-460110000000100
          topology:
            - A: gNB1
              B: BranchingUPF
            - A: BranchingUPF
              B: AnchorUPF1
          specificPath:
            - dest: 1.0.0.1/32
              path: [BranchingUPF, AnchorUPF2]
      logger:
        enable: true
        level: info
        reportCaller: false

free5gc-webui:
  webui:
    service:
      nodePort: 30510

free5gc-amf:
  amf:
    configuration:
      configuration: |-
        amfName: AMF
        serviceNameList:
          - namf-comm
          - namf-evts
          - namf-mt
          - namf-loc
          - namf-oam
        servedGuamiList:
          - plmnId:
              mcc: 460
              mnc: 11
            amfId: cafe00
        supportTaiList:
          - plmnId:
              mcc: 460
              mnc: 11
            tac: 000001
        plmnSupportList:
          - plmnId:
              mcc: 460
              mnc: 11
            snssaiList:
              - sst: 1
                sd: 010101
        supportDnnList:
          - cmnet
        security:
          integrityOrder:
            - NIA2
          cipheringOrder:
            - NEA0
        networkName:
          full: free5GC
          short: free
        ngapIE:
          mobilityRestrictionList:
            enable: true
          maskedIMEISV:
            enable: true
          redirectionVoiceFallback:
            enable: false
        nasIE:
          networkFeatureSupport5GS:
            enable: true
            length: 1
            imsVoPS: 0
            emc: 0
            emf: 0
            iwkN26: 0
            mpsi: 0
            emcN3: 0
            mcsi: 0
        t3502Value: 720
        t3512Value: 3600
        non3gppDeregTimerValue: 3240
        t3513:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3522:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3550:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3555:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3560:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3565:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3570:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        locality: area1
        sctp:
          numOstreams: 3
          maxInstreams: 5
          maxAttempts: 2
          maxInitTimeout: 2
        defaultUECtxReq: false

free5gc-nssf:
  nssf:
    configuration:
      configuration: |-
        nssfName: NSSF
        supportedPlmnList:
          - mcc: 460
            mnc: 11
        supportedNssaiInPlmnList:
          - plmnId:
              mcc: 460
              mnc: 11
            supportedSnssaiList:
              - sst: 1
                sd: 010101

free5gc-upf:
  iupf1:
    hostNetwork:
      enabled: false
      dnsPolicy: ClusterFirstWithHostNet
    service:
      gtpu:
        enabled: true
        type: ClusterIP
        bindAddress: 0.0.0.0
        port: 2152
        nodePort: 2152
        protocol: UDP
        hostPort:
          enabled: true
          hostIP: ""
          port: 2152
    podSecurityContext:
      sysctls: []
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      capabilities:
        add: ["NET_ADMIN"]
    configmap:
      wrapperAdditionalCommands: |-
        echo 1 > /proc/sys/net/ipv4/ip_forward
    configuration:
      dnnList:
        - dnn: cmnet
          cidr: 10.60.0.0/16
  psaupf1:
    podSecurityContext:
      sysctls: []
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      capabilities:
        add: ["NET_ADMIN"]
    configmap:
      wrapperAdditionalCommands: |-
        echo 1 > /proc/sys/net/ipv4/ip_forward
        ip route del default via 10.100.50.246 dev n4 2>/dev/null || true
        ip route del default via 10.100.50.230 dev n9 2>/dev/null || true
        ip route del default via 10.244.0.1 dev eth0 2>/dev/null || true
        ip route replace default via 10.100.100.1 dev n6 onlink
    configuration:
      dnnList:
        - dnn: cmnet
          cidr: 10.60.0.0/16
  psaupf2:
    podSecurityContext:
      sysctls: []
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      capabilities:
        add: ["NET_ADMIN"]
    configmap:
      wrapperAdditionalCommands: |-
        echo 1 > /proc/sys/net/ipv4/ip_forward
        ip route del default via 10.100.50.246 dev n4 2>/dev/null || true
        ip route del default via 10.100.50.230 dev n9 2>/dev/null || true
        ip route del default via 10.244.0.1 dev eth0 2>/dev/null || true
        ip route replace default via 10.100.200.1 dev n6 onlink
    configuration:
      dnnList:
        - dnn: cmnet
          cidr: 10.60.0.0/16
